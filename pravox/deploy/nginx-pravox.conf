# Add these locations INSIDE the existing HTTPS server block for zaa4eem.ru.
# Do not replace the site's server block or its location /.
# This example assumes Nginx and the app run on the SAME server.
# APP_PORT must match 8095 below. The full original URI is preserved.
location = /pravoXru {
    return 308 /pravoXru/;
}

location ^~ /pravoXru/ {
    proxy_pass http://127.0.0.1:8095;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    client_max_body_size 32k;
}
