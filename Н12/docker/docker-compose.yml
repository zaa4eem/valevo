services:
  valevo-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: valevo-bot
    restart: unless-stopped
    init: true
    env_file: [.env]
    environment:
      DATA_DIR: /app/data
      DB_NAME: /app/data/valevo.db
      LOG_DIR: /app/logs
      BACKUP_DIR: /app/backups
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  valevo-webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: valevo-webapp
    restart: unless-stopped
    init: true
    env_file: [.env]
    environment:
      DATA_DIR: /app/data
      DB_NAME: /app/data/valevo.db
      LOG_DIR: /app/logs
      BACKUP_DIR: /app/backups
      WEBAPP_HOST: 0.0.0.0
      WEBAPP_PORT: 8080
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-8080}:8080"
    depends_on:
      valevo-bot:
        condition: service_healthy
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
