services:
  valevo-bot:
    build: .
    container_name: valevo-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./valevo.db:/app/valevo.db
      - ./logs:/app/logs
      - ./backups:/app/backups
    stop_grace_period: 30s

  valevo-webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: valevo-webapp
    restart: unless-stopped
    env_file:
      - .env
    # Тот же bind-mount valevo.db, что и у valevo-bot — WAL-режим SQLite
    # поддерживает несколько процессов на одном файле, но файл должен быть
    # общим на хосте (не отдельным volume на контейнер).
    volumes:
      - ./valevo.db:/app/valevo.db
      - ./logs:/app/logs
      - ./backups:/app/backups
    # Наружу порт 8020 не публикуется вообще — трафик идёт через общий
    # nginx-proxy (deploy/docker-compose.proxy.yml) по внутренней сети
    # `proxy`, который сам находит этот контейнер по VIRTUAL_HOST/VIRTUAL_PORT.
    environment:
      - VIRTUAL_HOST=${WEBAPP_DOMAIN}
      - VIRTUAL_PORT=8020
      - LETSENCRYPT_HOST=${WEBAPP_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    networks:
      - default
      - proxy
    stop_grace_period: 30s

networks:
  default: {}
  proxy:
    name: proxy
    external: true
