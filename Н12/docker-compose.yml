services:
  valevo-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: valevo-bot
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATA_DIR: /app/data
      DB_NAME: /app/data/valevo.db
      LOG_DIR: /app/logs
      BACKUP_DIR: /app/backups
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    stop_grace_period: 30s

  valevo-webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: valevo-webapp
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATA_DIR: /app/data
      DB_NAME: /app/data/valevo.db
      LOG_DIR: /app/logs
      BACKUP_DIR: /app/backups
      WEBAPP_HOST: 0.0.0.0
      WEBAPP_PORT: 8080
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-8080}:8080"
    depends_on:
      - valevo-bot

  valevo-tvboard:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: valevo-tvboard
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATA_DIR: /app/data
      DB_NAME: /app/data/valevo.db
      LOG_DIR: /app/logs
      BACKUP_DIR: /app/backups
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    ports:
      - "127.0.0.1:${TVBOARD_PORT:-8010}:8010"
    command: ["python", "tv_board.py"]
    depends_on:
      - valevo-bot
