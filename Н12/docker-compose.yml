services:
  valevo-bot:
    build: .
    container_name: valevo-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./valevo.db:/app/valevo.db
      - ./logs:/app/logs
      - ./backups:/app/backups
    stop_grace_period: 30s

  valevo-webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: valevo-webapp
    restart: unless-stopped
    env_file:
      - .env
    # Тот же bind-mount valevo.db, что и у valevo-bot — WAL-режим SQLite
    # поддерживает несколько процессов на одном файле, но файл должен быть
    # общим на хосте (не отдельным volume на контейнер).
    volumes:
      - ./valevo.db:/app/valevo.db
      - ./logs:/app/logs
      - ./backups:/app/backups
    # Наружу порт 8020 не публикуется вообще — трафик идёт через общий
    # nginx-proxy (deploy/docker-compose.proxy.yml) по внутренней сети
    # `proxy`, который сам находит этот контейнер по VIRTUAL_HOST/VIRTUAL_PORT.
    environment:
      - VIRTUAL_HOST=${WEBAPP_DOMAIN}
      - VIRTUAL_PORT=8020
      - LETSENCRYPT_HOST=${WEBAPP_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    networks:
      - default
      - proxy
    stop_grace_period: 30s

  valevo-tvboard:
    # Тот же образ, что и у valevo-webapp (тот же requirements.txt — оба на
    # FastAPI/uvicorn), просто с другой точкой входа — отдельного Dockerfile
    # под tv_board.py заводить не нужно.
    build:
      context: .
      dockerfile: Dockerfile.webapp
    command: ["python", "tv_board.py"]
    container_name: valevo-tvboard
    restart: unless-stopped
    env_file:
      - .env
    # Только на чтение по сути (табло не пишет в БД), но общий bind-mount —
    # тот же принцип, что и у остальных сервисов: один файл на хосте, WAL
    # держит конкурентный доступ.
    volumes:
      - ./valevo.db:/app/valevo.db
    environment:
      - VIRTUAL_HOST=${TVBOARD_DOMAIN}
      - VIRTUAL_PORT=8010
      - LETSENCRYPT_HOST=${TVBOARD_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    networks:
      - default
      - proxy
    stop_grace_period: 30s

networks:
  default: {}
  proxy:
    name: proxy
    external: true
