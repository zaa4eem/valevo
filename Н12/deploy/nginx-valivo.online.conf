# ============================================================================
# nginx reverse proxy: valivo.online -> VALEVO Mini App backend (127.0.0.1:8020)
# ============================================================================
# Install:
#   sudo cp deploy/nginx-valivo.online.conf /etc/nginx/sites-available/valivo.online.conf
#   sudo ln -s /etc/nginx/sites-available/valivo.online.conf /etc/nginx/sites-enabled/
#
# Certificate: sudo certbot --nginx -d valivo.online -d www.valivo.online
#   NOTE (first deploy only): the HTTPS block below points at cert files that
#   don't exist yet, so nginx will refuse to start/reload with this file
#   as-is until a certificate exists. Comment out the "HTTPS BLOCK" section,
#   reload nginx, obtain the certificate, then uncomment it. Full
#   step-by-step (incl. the exact certbot invocation actually used here) is
#   in deploy/WEBAPP_DEPLOY.md.
# ============================================================================

# ---- HTTP (80): ACME challenge only, everything else -> HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name valivo.online www.valivo.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============== HTTPS BLOCK START (comment out for first-time bootstrap) ==============
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name valivo.online www.valivo.online;

    ssl_certificate     /etc/letsencrypt/live/valivo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/valivo.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Mini App грузит фото результата заезда с камеры телефона через
    # multipart-форму — с запасом, но не бесконечно.
    client_max_body_size 15m;

    access_log /var/log/nginx/valivo.online.access.log;
    error_log  /var/log/nginx/valivo.online.error.log;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
# ============== HTTPS BLOCK END ==============
