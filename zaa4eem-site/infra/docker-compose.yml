services:
  postgres:
    image: postgres:16-alpine
    container_name: zaa4eem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - zaa4eem-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: zaa4eem-api
    restart: unless-stopped
    env_file: .env
    environment:
      VIRTUAL_HOST: ${API_VIRTUAL_HOST}
      VIRTUAL_PORT: '3001'
      LETSENCRYPT_HOST: ${API_VIRTUAL_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - zaa4eem-api-uploads:/repo/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # Healthcheck is defined in apps/api/Dockerfile (image-level, so it also
    # applies when this image runs outside this compose file).
    expose:
      - '3001'
    networks:
      - default
      - proxy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* vars must reach `next build` at image-build time, not
      # just the running container — see the ARG/ENV lines in the Dockerfile.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: zaa4eem-web
    restart: unless-stopped
    env_file: .env
    environment:
      VIRTUAL_HOST: ${WEB_VIRTUAL_HOST}
      VIRTUAL_PORT: '3000'
      LETSENCRYPT_HOST: ${WEB_VIRTUAL_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      # Override the shared .env's PORT=3001 (meant for `api`) — Next.js's
      # standalone server also reads PORT and would otherwise bind to 3001,
      # while nginx-proxy connects on VIRTUAL_PORT=3000 above → 502.
      PORT: '3000'
    depends_on:
      api:
        condition: service_healthy
    expose:
      - '3000'
    networks:
      - default
      - proxy

  bot:
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    container_name: zaa4eem-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default

networks:
  default:
  proxy:
    external: true
    name: ${NGINX_PROXY_NETWORK}

volumes:
  zaa4eem-postgres-data:
  zaa4eem-api-uploads:
