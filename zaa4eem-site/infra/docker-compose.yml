services:
  postgres:
    image: postgres:16-alpine
    container_name: zaa4eem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - zaa4eem-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: zaa4eem-api
    restart: unless-stopped
    env_file: .env
    environment:
      VIRTUAL_HOST: ${API_VIRTUAL_HOST}
      VIRTUAL_PORT: '3001'
      LETSENCRYPT_HOST: ${API_VIRTUAL_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3001'
    networks:
      - default
      - proxy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: zaa4eem-web
    restart: unless-stopped
    env_file: .env
    environment:
      VIRTUAL_HOST: ${WEB_VIRTUAL_HOST}
      VIRTUAL_PORT: '3000'
      LETSENCRYPT_HOST: ${WEB_VIRTUAL_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    depends_on:
      - api
    expose:
      - '3000'
    networks:
      - default
      - proxy

  bot:
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    container_name: zaa4eem-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
    networks:
      - default

networks:
  default:
  proxy:
    external: true
    name: ${NGINX_PROXY_NETWORK}

volumes:
  zaa4eem-postgres-data:
