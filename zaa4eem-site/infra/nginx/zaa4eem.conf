# Nginx site config for zaa4eem.ru — proxies the Next.js app (web) and the
# NestJS API (under /api) behind one HTTPS origin. Runs inside the `nginx`
# service in docker-compose.yml.
#
# First deploy: request the certificate before this file can enable the
# HTTPS server block (see DEPLOY.md step "TLS certificate"). Until then,
# comment out the second `server` block and keep only the ACME-challenge
# location in the HTTP block.

server {
    listen 80;
    server_name zaa4eem.ru www.zaa4eem.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name zaa4eem.ru www.zaa4eem.ru;

    ssl_certificate     /etc/letsencrypt/live/zaa4eem.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaa4eem.ru/privkey.pem;

    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
